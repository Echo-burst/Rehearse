<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rehearse</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171C24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehearse">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ MAIN MENU ============ -->
<section id="view-home" class="view">
  <div class="home-wrap">
    <div class="bar">
      <p class="kicker">Rehearse</p>
      <select id="lang" class="lang" aria-label="Language"></select>
    </div>

    <div class="home-hero">
      <h1 class="display" data-t="headline"></h1>
      <p class="lede" data-t="lede"></p>
    </div>

    <div class="home-actions">
      <button class="btn primary wide" data-goto="signin" data-t="signIn"></button>
      <button class="btn ghost wide" data-goto="signup" data-t="signUp"></button>
      <button id="btn-demo" class="linkish" data-t="demo"></button>
    </div>
  </div>
</section>

<!-- ============ SIGN IN ============ -->
<section id="view-signin" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="home" data-t="back"></button>
  </header>

  <div class="stack form-wrap">
    <h2 data-t="signIn"></h2>
    <form id="signin-form" class="card" autocomplete="on">
      <label for="email" data-t="emailLabel"></label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">

      <label for="password" data-t="passwordLabel"></label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" data-tp="passwordPh">

      <p id="signin-error" class="error" hidden></p>
      <button id="btn-signin" type="submit" class="btn primary" data-t="signIn"></button>
    </form>
  </div>
</section>

<!-- ============ SIGN UP ============ -->
<section id="view-signup" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="home" data-t="back"></button>
  </header>

  <div class="stack form-wrap">
    <h2 data-t="signUp"></h2>
    <form id="signup-form" class="card" autocomplete="on">
      <label for="su-email" data-t="emailLabel"></label>
      <input id="su-email" type="email" required autocomplete="email" placeholder="you@example.com">

      <label for="su-password" data-t="passwordLabel"></label>
      <input id="su-password" type="password" required minlength="6" autocomplete="new-password" data-tp="passwordPh">

      <p id="signup-error" class="error" hidden></p>
      <button id="btn-signup" type="submit" class="btn primary" data-t="signUp"></button>
    </form>
  </div>
</section>

<!-- ============ SCENARIO LIST ============ -->
<section id="view-list" class="view" hidden>
  <header class="bar">
    <p class="kicker">Rehearse</p>
    <span class="bar-actions">
      <button id="btn-history" class="linkish" data-t="history"></button>
      <button id="btn-signout" class="linkish" data-t="signOut"></button>
    </span>
  </header>

  <div class="stack">
    <div class="greeting">
      <h2 id="greet" class="greet-line"></h2>
      <p id="greet-tag" class="lede greet-tag"></p>
    </div>
    <button id="btn-new" class="btn primary wide" data-t="newConversation"></button>
    <div id="scenario-list" class="stack"></div>
    <p id="list-empty" class="empty" data-t="listEmpty" hidden></p>
  </div>
</section>

<!-- ============ NEW SCENARIO ============ -->
<section id="view-new" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="list" data-t="back"></button>
  </header>

  <div class="stack">
    <h2 data-t="newHeading"></h2>
    <form id="scenario-form" class="card">
      <label for="s-title" data-t="titleLabel"></label>
      <input id="s-title" required maxlength="80" data-tp="titlePh">

      <label for="s-person" data-t="personLabel"></label>
      <input id="s-person" required maxlength="60" data-tp="personPh">

      <label for="s-context" data-t="contextLabel"></label>
      <textarea id="s-context" required rows="3" maxlength="500" data-tp="contextPh"></textarea>

      <label for="s-goal" data-t="goalLabel"></label>
      <textarea id="s-goal" required rows="2" maxlength="300" data-tp="goalPh"></textarea>

      <p id="new-error" class="error" hidden></p>
      <button type="submit" class="btn primary" data-t="start"></button>
    </form>
  </div>
</section>

<!-- ============ REHEARSAL ============ -->
<section id="view-rehearse" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="list" data-t="leave"></button>
    <p id="rehearse-title" class="bar-title"></p>
  </header>

  <div id="transcript" class="transcript"></div>

  <form id="reply-form" class="composer">
    <textarea id="reply" rows="2" required data-tp="replyPh"></textarea>
    <button type="submit" class="btn primary" id="btn-send" data-t="send"></button>
    <button type="button" class="btn ghost" id="btn-finish" data-t="finish"></button>
  </form>
</section>

<!-- ============ FEEDBACK ============ -->
<section id="view-feedback" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="list" data-t="back"></button>
  </header>

  <div class="stack">
    <div class="card score-card">
      <p class="kicker" data-t="scoreKicker"></p>
      <p id="score" class="score">&mdash;</p>
      <p id="score-label" class="muted"></p>
    </div>
    <div id="feedback-body" class="card"></div>
    <button class="btn primary wide" data-goto="list" data-t="done"></button>
  </div>
</section>

<!-- ============ HISTORY ============ -->
<section id="view-history" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="list" data-t="back"></button>
    <p class="bar-title" data-t="historyTitle"></p>
  </header>

  <div id="history-list" class="stack"></div>
  <p id="history-empty" class="empty" data-t="historyEmpty" hidden></p>
</section>

<div id="install" class="install" hidden>
  <div class="install-text">
    <p class="install-title" data-t="installTitle"></p>
    <p id="install-hint" class="install-hint" hidden></p>
  </div>
  <div class="install-actions">
    <button id="install-go" class="btn primary mini-btn" data-t="installBtn"></button>
    <button id="install-later" class="linkish" data-t="installLater"></button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
