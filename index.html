<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rehearse</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171C24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rehearse">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ==================================================================== -->
<!--  SIGNED OUT.  These three are the only screens reachable without an  -->
<!--  account. app.js refuses to show anything else until you sign in.    -->
<!-- ==================================================================== -->

<!-- ============ WELCOME ============ -->
<section id="view-auth" class="view">
  <div class="home-wrap">
    <div class="bar">
      <p class="kicker wordmark">Rehearse</p>
      <select id="lang" class="lang" aria-label="Language"></select>
    </div>

    <div class="home-hero">
      <h1 class="display" data-t="headline"></h1>
      <p class="lede" data-t="lede"></p>
    </div>

    <div class="home-actions">
      <button class="btn primary wide" data-goto="signin" data-t="signIn"></button>
      <button class="btn ghost wide" data-goto="signup" data-t="signUp"></button>
      <button id="btn-demo" class="linkish" data-t="demo"></button>
    </div>
  </div>
</section>

<!-- ============ SIGN IN ============ -->
<section id="view-signin" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="auth" data-t="back"></button>
  </header>

  <div class="stack form-wrap">
    <h2 data-t="signIn"></h2>
    <form id="signin-form" class="card" autocomplete="on">
      <label for="email" data-t="emailLabel"></label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">

      <label for="password" data-t="passwordLabel"></label>
      <input id="password" type="password" required minlength="6" autocomplete="current-password" data-tp="passwordPh">

      <p id="signin-error" class="error" hidden></p>
      <button id="btn-signin" type="submit" class="btn primary" data-t="signIn"></button>
    </form>
    <button class="linkish center" data-goto="reset" data-t="forgot"></button>
  </div>
</section>

<!-- ============ FORGOT PASSWORD ============ -->
<section id="view-reset" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="signin" data-t="back"></button>
  </header>

  <div class="stack form-wrap">
    <h2 data-t="resetTitle"></h2>
    <form id="reset-form" class="card">
      <p class="lede small-lede" data-t="resetHint"></p>
      <label for="reset-email" data-t="emailLabel"></label>
      <input id="reset-email" type="email" required autocomplete="email" placeholder="you@example.com">
      <p id="reset-error" class="error" hidden></p>
      <button id="btn-reset" type="submit" class="btn primary" data-t="resetSend"></button>
    </form>
  </div>
</section>

<!-- ============ SET A NEW PASSWORD ============ -->
<section id="view-newpass" class="view" hidden>
  <div class="stack form-wrap">
    <h2 data-t="newPassTitle"></h2>
    <form id="newpass-form" class="card">
      <label for="new-password" data-t="passwordLabel"></label>
      <input id="new-password" type="password" required minlength="6" autocomplete="new-password" data-tp="passwordPh">
      <p id="newpass-error" class="error" hidden></p>
      <button id="btn-newpass" type="submit" class="btn primary" data-t="newPassSave"></button>
    </form>
  </div>
</section>

<!-- ============ SIGN UP ============ -->
<section id="view-signup" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="auth" data-t="back"></button>
  </header>

  <div class="stack form-wrap">
    <h2 data-t="signUp"></h2>
    <form id="signup-form" class="card" autocomplete="on">
      <label for="su-name" data-t="nameLabel"></label>
      <input id="su-name" type="text" required maxlength="40" autocomplete="given-name" data-tp="namePh">

      <label for="su-email" data-t="emailLabel"></label>
      <input id="su-email" type="email" required autocomplete="email" placeholder="you@example.com">

      <label for="su-password" data-t="passwordLabel"></label>
      <input id="su-password" type="password" required minlength="6" autocomplete="new-password" data-tp="passwordPh">

      <p id="signup-error" class="error" hidden></p>
      <button id="btn-signup" type="submit" class="btn primary" data-t="signUp"></button>
    </form>
  </div>
</section>

<!-- ==================================================================== -->
<!--  SIGNED IN.  Everything below requires a session.                    -->
<!-- ==================================================================== -->

<!-- ============ MAIN MENU ============ -->
<section id="view-menu" class="view" hidden>
  <header class="bar">
    <button id="account" class="account" aria-haspopup="true">
      <span id="account-initial" class="avatar"></span>
      <span class="account-text">
        <span id="account-name" class="account-name"></span>
        <span id="account-rank" class="account-rank" hidden><img alt=""><span></span></span>
      </span>
    </button>
    <button id="btn-extras" type="button" class="extras-btn" data-goto="extras" hidden>
      <img src="rank-oblivion.png" alt=""><span data-t="extras"></span>
      <i id="extras-dot" class="extras-dot" hidden></i>
    </button>
    <button type="button" class="energy-pill" aria-label="Energy">
      <img src="energy.png" alt="" class="energy-icon">
      <span class="energy-num">0</span>
    </button>
    <span class="bar-actions">
      <select id="lang-menu" class="lang" aria-label="Language"></select>
    </span>
  </header>

  <div class="menu-wrap">
    <div class="greeting">
      <h2 id="greet" class="greet-line"></h2>
      <p id="greet-tag" class="lede greet-tag"></p>
    </div>

    <p id="notice" class="notice" hidden></p>

    <nav class="stack">
      <button class="nav-card accent" data-goto="new">
        <span class="nav-title" data-t="newConversation"></span>
        <span class="nav-desc" data-t="descNew"></span>
      </button>

      <button class="nav-card" data-goto="list">
        <span class="nav-title" data-t="myConversations"></span>
        <span class="nav-desc" data-t="descList"></span>
      </button>

      <button class="nav-card" data-goto="stats">
        <span class="nav-title" data-t="myStats"></span>
        <span class="nav-desc" data-t="descStats"></span>
      </button>

      <button class="nav-card" data-goto="history">
        <span class="nav-title" data-t="history"></span>
        <span class="nav-desc" data-t="descHistory"></span>
      </button>

      <button id="nav-admin" class="nav-card" data-goto="admin" hidden>
        <span class="nav-title" data-t="adminTitle"></span>
        <span class="nav-desc" data-t="descAdmin"></span>
      </button>
    </nav>
  </div>
</section>

<!-- ============ MESSAGES TO OBLIVION (admin only) ============ -->
<section id="view-dm" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="admin" data-t="back"></button>
    <p class="bar-title" data-t="adminDm"></p>
  </header>

  <div class="stack">
    <div class="card">
      <p class="panel-title energy-title"><img src="rank-oblivion.png" alt="" class="energy-icon"><span data-t="adminDm"></span></p>
      <p class="lede small-lede" data-t="adminDmHint"></p>
      <label for="dm-to" data-t="dmTo"></label>
      <select id="dm-to" class="dm-to"></select>
      <textarea id="dm-body" rows="3" maxlength="2000" data-tp="dmPh"></textarea>
      <p id="dm-note" class="muted small" data-t="dmNoOblivions" hidden></p>
      <button id="btn-dm-send" type="button" class="btn primary" data-t="dmSend"></button>

      <p class="field-label dm-sent-title" data-t="dmSentList"></p>
      <div id="dm-sent" class="dm-list"></div>
    </div>

  </div>
</section>

<!-- ============ LEAVE A REVIEW (Elite and higher) ============ -->
<section id="view-review" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="reviewBtn"></p>
  </header>

  <div class="stack">
    <div class="card review-card">
      <p class="panel-title" data-t="reviewTitle"></p>
      <p class="lede small-lede" data-t="reviewLead"></p>
      <div id="review-stars" class="review-stars" role="radiogroup" data-t-aria="reviewStarsAria">
        <button type="button" class="star" data-star="1" aria-label="1">★</button>
        <button type="button" class="star" data-star="2" aria-label="2">★</button>
        <button type="button" class="star" data-star="3" aria-label="3">★</button>
        <button type="button" class="star" data-star="4" aria-label="4">★</button>
        <button type="button" class="star" data-star="5" aria-label="5">★</button>
      </div>
      <textarea id="review-body" rows="5" maxlength="2000" data-tp="reviewPh"></textarea>
      <p id="review-error" class="error" hidden></p>
      <button id="btn-review-send" type="button" class="btn primary" data-t="reviewSend"></button>
      <p class="muted small" data-t="reviewPrivacy"></p>
    </div>
  </div>
</section>

<!-- ============ REVIEWS (admin only) ============ -->
<section id="view-reviews" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="admin" data-t="back"></button>
    <p class="bar-title" data-t="reviewsTitle"></p>
  </header>

  <div class="stack">
    <p id="reviews-avg" class="reviews-avg" hidden></p>
    <div id="reviews-list" class="stack"></div>
    <p id="reviews-empty" class="empty" data-t="reviewsEmpty" hidden></p>
  </div>
</section>

<!-- ============ ACCOUNTS (admin only) ============ -->
<section id="view-accounts" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="admin" data-t="back"></button>
    <p class="bar-title" data-t="adminAccounts"></p>
  </header>

  <div class="stack">
    <div class="acc-tools">
      <input id="acc-search" type="search" autocomplete="off" data-tp="accSearchPh">
      <div class="acc-row">
        <div class="acc-filter" role="group">
          <button type="button" class="chip on" data-filter="all" data-t="accAll"></button>
          <button type="button" class="chip" data-filter="active" data-t="activeNow"></button>
          <button type="button" class="chip" data-filter="dormant" data-t="dormant"></button>
        </div>
        <select id="acc-sort" class="acc-sort" data-t-aria="accSortAria">
          <option value="new" data-t="sortNew"></option>
          <option value="seen" data-t="sortSeen"></option>
          <option value="energy" data-t="sortEnergy"></option>
          <option value="score" data-t="sortScore"></option>
          <option value="name" data-t="sortName"></option>
        </select>
      </div>
      <p id="acc-shown" class="muted small acc-shown"></p>
    </div>
    <div id="user-list" class="user-list"></div>
    <p id="acc-none" class="empty" data-t="accNone" hidden></p>
  </div>
</section>

<!-- ============ MY CONVERSATIONS ============ -->
<section id="view-list" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="myConversations"></p>
  </header>

  <div class="stack">
    <div id="scenario-list" class="stack"></div>
    <p id="list-empty" class="empty" data-t="listEmpty" hidden></p>
  </div>
</section>

<!-- ============ NEW CONVERSATION ============ -->
<section id="view-new" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
  </header>

  <div class="stack">
    <h2 data-t="newHeading"></h2>
    <form id="scenario-form" class="card">
      <label for="s-title" data-t="titleLabel"></label>
      <input id="s-title" required maxlength="80" data-tp="titlePh">

      <label for="s-person" data-t="personLabel"></label>
      <input id="s-person" required maxlength="60" data-tp="personPh">

      <label for="s-situation"><span data-t="situationLabel"></span> <span class="opt" data-t="optional"></span></label>
      <textarea id="s-situation" rows="2" maxlength="400" data-tp="situationPh"></textarea>

      <label for="s-context" data-t="contextLabel"></label>
      <textarea id="s-context" required rows="3" maxlength="500" data-tp="contextPh"></textarea>

      <label for="s-goal" data-t="goalLabel"></label>
      <textarea id="s-goal" required rows="2" maxlength="300" data-tp="goalPh"></textarea>

      <p class="field-label" data-t="starterLabel"></p>
      <div class="segmented" role="radiogroup">
        <label class="seg">
          <input type="radio" name="starter" value="them" checked>
          <span data-t="starterThem"></span>
        </label>
        <label class="seg">
          <input type="radio" name="starter" value="me">
          <span data-t="starterMe"></span>
        </label>
      </div>

      <p id="new-error" class="error" hidden></p>
      <button type="submit" class="btn primary" data-t="start"></button>
    </form>
  </div>
</section>

<!-- ============ REHEARSAL ============ -->
<section id="view-rehearse" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="list" data-t="leave"></button>
    <button type="button" class="energy-pill" aria-label="Energy">
      <img src="energy.png" alt="" class="energy-icon">
      <span class="energy-num">0</span>
    </button>
    <p id="rehearse-title" class="bar-title"></p>
  </header>

  <div id="support" class="support-card" hidden>
    <p class="support-title" data-t="supportTitle"></p>
    <p class="support-body" data-t="supportBody"></p>
    <button id="btn-support-close" type="button" class="btn ghost" data-t="supportClose"></button>
  </div>

  <div id="transcript" class="transcript"></div>

  <form id="reply-form" class="composer">
    <div class="composer-row">
      <textarea id="reply" rows="2" required data-tp="replyPh"></textarea>
      <button type="button" id="btn-mic" class="mic" hidden aria-label="Speak">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <path d="M12 18v3"/>
        </svg>
      </button>
    </div>

    <div id="hint-box" class="hint-box" hidden>
      <p class="hint-label" data-t="hintTitle"></p>
      <p id="hint-text" class="hint-text"></p>
      <button id="btn-use-hint" type="button" class="mini" data-t="useHint" hidden></button>
    </div>

    <div class="composer-actions">
      <button type="button" id="btn-rewind" class="tool-btn">
        <span class="tool-name" data-t="rewind"></span>
        <span class="cost"><img src="energy.png" alt="">5</span>
      </button>
      <button type="button" id="btn-hint" class="tool-btn">
        <span class="tool-name" data-t="hintBtn"></span>
        <span class="cost"><img src="energy.png" alt="">10</span>
      </button>
      <button type="submit" class="btn primary send-btn" id="btn-send" data-t="send"></button>
    </div>
    <button type="button" class="btn ghost" id="btn-finish" data-t="finish"></button>
  </form>
</section>

<!-- ============ FEEDBACK ============ -->
<section id="view-feedback" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
  </header>

  <div class="stack">
    <div class="card score-card">
      <p class="kicker" data-t="scoreKicker"></p>
      <p id="score" class="score">&mdash;</p>
      <p id="score-label" class="muted"></p>
      <p id="score-motivation" class="motivation" hidden></p>
      <p id="score-energy" class="score-energy" hidden><img src="energy.png" alt=""><span></span></p>
    </div>
    <div id="feedback-body" class="card"></div>

    <div class="card explain-card">
      <button id="btn-why" class="btn ghost" data-t="whyScore"></button>
      <div id="explain-thread" class="explain-thread" hidden></div>
      <form id="ask-form" class="ask-row" hidden>
        <input id="ask-input" type="text" maxlength="300" autocomplete="off" data-tp="askPh">
        <button id="btn-ask" type="submit" class="btn primary ask-btn" data-t="ask"></button>
      </form>
    </div>
    <button class="btn primary wide" data-goto="menu" data-t="done"></button>
  </div>
</section>

<!-- ============ HISTORY ============ -->
<section id="view-history" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="historyTitle"></p>
  </header>

  <div id="history-list" class="stack"></div>
  <p id="history-empty" class="empty" data-t="historyEmpty" hidden></p>
</section>

<!-- ============ ONE SAVED CONVERSATION (read-only) ============ -->
<section id="view-transcript" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="history" data-t="back"></button>
    <p class="bar-title" data-t="savedConvo"></p>
  </header>

  <div class="stack">
    <div class="card saved-head">
      <span id="saved-score" class="history-score"></span>
      <span class="saved-meta">
        <h2 id="saved-title"></h2>
        <p id="saved-sub" class="muted small"></p>
      </span>
    </div>

    <p class="readonly-note" data-t="readOnlyNote"></p>
    <div id="saved-transcript" class="transcript saved"></div>
    <p id="saved-empty" class="empty" data-t="noTranscript" hidden></p>

    <div id="saved-feedback-card" class="card">
      <p class="kicker" data-t="scoreKicker"></p>
      <p id="saved-feedback" class="saved-feedback"></p>
    </div>
  </div>
</section>

<!-- ============ HOW RANKS WORK (everyone) ============ -->
<section id="view-ranks" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="rankGuide"></p>
  </header>

  <div class="stack">
    <div class="card">
      <h2 data-t="rankGuide"></h2>
      <p class="lede guide-lead" data-t="rankGuideLead"></p>
    </div>

    <div class="card">
      <p class="panel-title energy-title"><img src="energy.png" alt="" class="energy-icon"><span data-t="earnTitle"></span></p>
      <div class="energy-guide"></div>
    </div>

    <p class="panel-title section-title" data-t="allRanks"></p>
    <div id="rank-ladder-guide" class="rank-ladder"></div>
  </div>
</section>

<!-- ============ EXTRAS (Oblivion rank only) ============ -->
<section id="view-extras" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="extras"></p>
  </header>

  <div class="stack">
    <div class="card extras-hero">
      <img src="rank-oblivion.png" alt="" class="extras-emblem">
      <h2 class="rank-name rank-oblivion">Oblivion</h2>
      <p class="lede" data-t="extrasLead"></p>
    </div>

    <div class="card dm-inbox">
      <p class="panel-title" data-t="dmTitle"></p>
      <div id="dm-list" class="dm-list"></div>
      <p id="dm-empty" class="muted small" data-t="dmEmpty" hidden></p>
      <p class="dm-readonly" data-t="dmReadOnly"></p>
    </div>

    <p class="panel-title section-title" data-t="allRanks"></p>
    <div id="rank-ladder" class="rank-ladder"></div>
  </div>
</section>

<!-- ============ MY STATISTICS (every user, their own data only) ============ -->
<section id="view-stats" class="view" hidden>
  <header class="bar">
    <button id="stats-back" class="linkish back" data-goto="menu" data-t="back"></button>
    <p id="stats-heading" class="bar-title" data-t="myStats"></p>
  </header>

  <p id="stats-privacy" class="privacy-note" data-t="adminPrivacy" hidden></p>

  <p id="mystats-empty" class="empty" data-t="noStats" hidden></p>

  <div id="mystats-body" class="stack" hidden>
    <div id="mystats-tiles" class="stats-tiles"></div>

    <div class="card">
      <p class="panel-title" data-t="allScores"></p>
      <div id="mystats-chart" class="chart"></div>
      <p id="mystats-trend" class="trend"></p>
    </div>

    <div class="card">
      <p class="panel-title" data-t="realOutcomes"></p>
      <div id="mystats-real" class="uc-tiles"></div>
    </div>

    <p id="mystats-convos-title" class="panel-title section-title" data-t="byConversation"></p>
    <div id="mystats-convos" class="stack"></div>
  </div>
</section>

<!-- ============ PROGRESS FOR ONE CONVERSATION ============ -->
<section id="view-progress" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="list" data-t="back"></button>
    <p class="bar-title" data-t="progressTitle"></p>
  </header>

  <div class="stack">
    <div class="card">
      <h2 id="progress-name"></h2>
      <p id="progress-with" class="muted small"></p>
      <div id="progress-chart" class="chart"></div>
      <p id="progress-trend" class="trend"></p>
      <div id="progress-tiles" class="uc-tiles"></div>
      <p id="progress-empty" class="empty" data-t="noAttempts" hidden></p>
    </div>

    <div class="card">
      <p class="panel-title" data-t="realTitle"></p>
      <p class="lede small-lede" data-t="realHint"></p>
      <div class="outcomes" role="radiogroup">
        <label class="seg"><input type="radio" name="outcome" value="well"><span data-t="outWell"></span></label>
        <label class="seg"><input type="radio" name="outcome" value="mixed"><span data-t="outMixed"></span></label>
        <label class="seg"><input type="radio" name="outcome" value="bad"><span data-t="outBad"></span></label>
        <label class="seg"><input type="radio" name="outcome" value="notyet"><span data-t="outNotYet"></span></label>
      </div>
      <textarea id="real-note" rows="2" maxlength="300" data-tp="realNotePh"></textarea>
      <button id="btn-real-save" class="btn primary" data-t="realSave"></button>
    </div>
  </div>
</section>

<!-- ============ MY COLOURS ============ -->
<section id="view-theme" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="myColours"></p>
  </header>

  <div class="stack">
    <div class="card">
      <p class="lede small-lede" data-t="themeHint"></p>

      <div class="swatches">
        <label class="swatch"><span data-t="colAccent"></span><input id="my-accent" type="color"></label>
        <label class="swatch"><span data-t="colThem"></span><input id="my-them" type="color"></label>
        <label class="swatch"><span data-t="colBg"></span><input id="my-bg" type="color"></label>
        <label class="swatch"><span data-t="colSurface"></span><input id="my-surface" type="color"></label>
        <label class="swatch"><span data-t="colText"></span><input id="my-ink" type="color"></label>
      </div>

      <button id="btn-theme-save" class="btn primary" data-t="themeSave"></button>
      <button id="btn-theme-reset" class="btn ghost" data-t="themeReset"></button>
    </div>
  </div>
</section>

<!-- ============ ADMIN ============ -->
<section id="view-admin" class="view" hidden>
  <header class="bar">
    <button class="linkish back" data-goto="menu" data-t="back"></button>
    <p class="bar-title" data-t="adminTitle"></p>
  </header>

  <div class="stack">
    <button id="nav-accounts" class="nav-card" data-goto="accounts">
      <span class="nav-title">👤 <span data-t="adminAccounts"></span> <span id="accounts-count" class="reviews-count"></span></span>
      <span class="nav-desc" data-t="descAccounts"></span>
    </button>

    <button id="nav-dm" class="nav-card" data-goto="dm">
      <span class="nav-title">✉ <span data-t="adminDm"></span></span>
      <span class="nav-desc" data-t="descDm"></span>
    </button>

    <button id="nav-reviews" class="nav-card" data-goto="reviews">
      <span class="nav-title">★ <span data-t="reviewsTitle"></span> <span id="reviews-count" class="reviews-count"></span></span>
      <span class="nav-desc" data-t="descReviews"></span>
    </button>

    <div id="stats" class="stats"></div>

    <div class="card">
      <p class="panel-title" data-t="adminDesign"></p>

      <!-- Colours here are the admin's own, exactly like "My colours":
           they change only how the app looks for this account. -->
      <div class="swatches">
        <label class="swatch"><span data-t="colAccent"></span><input id="admin-accent" type="color"></label>
        <label class="swatch"><span data-t="colThem"></span><input id="admin-them" type="color"></label>
        <label class="swatch"><span data-t="colBg"></span><input id="admin-bg" type="color"></label>
        <label class="swatch"><span data-t="colSurface"></span><input id="admin-surface" type="color"></label>
        <label class="swatch"><span data-t="colText"></span><input id="admin-ink" type="color"></label>
      </div>
      <p class="lede small-lede" data-t="themeHint"></p>
      <button id="btn-admin-colours" class="btn primary" data-t="themeSave"></button>
      <button id="btn-admin-original" class="btn ghost" data-t="adminOriginal"></button>

      <label for="admin-wordmark" data-t="adminWordmark"></label>
      <input id="admin-wordmark" type="text" maxlength="24">

      <label for="admin-notice" data-t="adminNotice"></label>
      <input id="admin-notice" type="text" maxlength="120">

      <p id="admin-error" class="error" hidden></p>
      <button id="btn-admin-save" class="btn primary" data-t="adminSave"></button>
    </div>

    <div class="card">
      <p class="panel-title energy-title"><img src="energy.png" alt="" class="energy-icon"><span data-t="adminEnergyAll"></span></p>
      <p class="lede small-lede" data-t="adminEnergyHint"></p>
      <div class="energy-row">
        <input id="energy-all-amount" type="number" min="1" max="100000" value="10" data-tp="amountPh">
        <button id="btn-energy-give-all" type="button" class="btn primary" data-t="giveAll"></button>
      </div>

      <div class="self-energy">
        <p class="field-label" data-t="yourEnergy"></p>
        <div class="energy-row">
          <span class="energy-chip"><img src="energy.png" alt=""><b class="energy-num">0</b></span>
          <input id="self-amount" type="number" min="0" max="2000000000" value="100" data-tp="amountPh">
        </div>
        <div class="energy-row">
          <button id="btn-self-give" type="button" class="btn primary" data-t="giveMe"></button>
          <button id="btn-self-set" type="button" class="btn ghost" data-t="setTo"></button>
          <button id="btn-self-inf" type="button" class="btn ghost e-inf"></button>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- ============ WELCOME WINDOW (first visit only) ============ -->
<div id="intro" class="overlay" hidden>
  <div class="intro-card">
    <p class="kicker wordmark">Rehearse</p>
    <h2 data-t="introTitle"></h2>
    <ul class="intro-list">
      <li data-t="intro1"></li>
      <li data-t="intro2"></li>
      <li data-t="intro3"></li>
    </ul>
    <button id="btn-intro" class="btn primary wide" data-t="introBtn"></button>
  </div>
</div>

<div id="account-panel" class="account-panel" hidden>
  <p class="panel-title" data-t="accountTitle"></p>

  <div id="panel-rank" class="panel-rank">
    <img id="panel-rank-img" alt="" hidden>
    <span class="panel-rank-text">
      <span class="panel-label" data-t="rankLabel"></span>
      <span id="panel-rank-name" class="rank-name"></span>
      <span id="panel-rank-next" class="panel-rank-next"></span>
    </span>
    <button id="btn-rank-help" type="button" class="rank-help" data-goto="ranks" aria-label="?" data-t-aria="rankHelpAria">?</button>
  </div>

  <div class="panel-score">
    <span id="account-avg" class="panel-score-value">—</span>
    <span id="account-avg-label" class="panel-score-label"></span>
  </div>
  <p id="account-motivation" class="motivation panel-motivation" hidden></p>

  <p class="panel-label" data-t="signedInAs"></p>
  <p id="account-email" class="panel-email"></p>

  <label for="account-rename" class="panel-label" data-t="nameLabel"></label>
  <div class="panel-row">
    <input id="account-rename" type="text" maxlength="40" data-tp="namePh">
    <button id="btn-rename" class="mini" data-t="saveName"></button>
  </div>

  <button id="btn-review" class="btn ghost wide" data-goto="review" hidden>★ <span data-t="reviewBtn"></span></button>
  <button class="btn ghost wide" data-goto="theme" data-t="myColours"></button>
  <button id="btn-signout" class="btn ghost wide" data-t="signOut"></button>
  <button id="btn-delete-me" type="button" class="linkish danger-link" data-t="deleteMine"></button>
</div>

<div id="energy-help" class="energy-help" hidden>
  <p class="energy-help-title"><img src="energy.png" alt="" class="energy-icon"><span data-t="energy"></span>: <b class="energy-num">0</b></p>
  <div class="energy-guide"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
